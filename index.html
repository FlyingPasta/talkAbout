<!DOCTYPE html>
<html lang="ja" name="robots" content="noindex">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>これについて語って！</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">

    <h1>これについて語って！</h1>

    <section class="genre-section">

      <div class="genre-header">
        <h2>ジャンル選択</h2>

        <div class="genre-buttons">
          <button type="button" onclick="selectAllGenres(true)">
            全選択
          </button>

          <button type="button" onclick="selectAllGenres(false)">
            全解除
          </button>
        </div>
      </div>

      <div id="genres" class="genre-list"></div>

      <div class="generate-button">
        <button type="button" onclick="showRandomWord()">
          ランダムに表示
        </button>
      </div>

    </section>

    <section class="result-section">
      <div id="word">
        <div class="word-main"></div>
        <div class="word-meta"></div>
      </div>
    </section>

    <section id="history">
      <h2>履歴</h2>
      <ul id="historyList"></ul>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
